runtime:
  live_enabled: false
  scan_refresh_seconds: 5
  stats_window_seconds: 600
  min_buffer_ticks: 100

fees:
  require_zero_maker: true
  require_zero_taker: true
  unknown_is_blocked: true

scanner:
  max_symbols_for_shadow: 12
  min_volume24: 1000000
  max_spread_bps: 12.0
  min_tick_rate_per_sec: 0.5
  min_realized_move_bps: 3.0

strategy:
  momentum_ticks: [2, 3, 4, 5, 6]
  reversal_ticks: [1, 2]
  min_shadow_trades: 20
  min_profit_factor: 1.30
  min_expectancy_bps: 0.0
  max_hold_seconds: 180
  cooldown_after_exit_ms: 250

risk:
  bankroll_usdt: 200.0
  base_margin_fraction: 0.03
  max_margin_per_trade_usdt: 10.0
  max_leverage: 100
  min_leverage: 1
  max_session_loss_usdt: 30.0
  max_consecutive_losses: 8

mexc:
  rest_base_url: "https://api.mexc.com"
  websocket_url: "wss://contract.mexc.com/edge"
