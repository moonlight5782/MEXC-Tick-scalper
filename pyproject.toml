[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "mexc-tick-scalper"
version = "0.1.0"
description = "Adaptive zero-fee MEXC futures tick scalper research bot"
requires-python = ">=3.11"
dependencies = [
  "aiohttp>=3.10",
  "websockets>=12",
  "PyYAML>=6.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "rich>=13.7",
]

[project.scripts]
mexc-scalper = "mexc_tick_scalper.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
