name: Testnet Smoke

on:
  workflow_dispatch:
    inputs:
      scan_seconds:
        description: Fresh discovery window before trading
        required: true
        default: "30"
      session_seconds:
        description: Maximum trading session length
        required: true
        default: "300"

jobs:
  testnet-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    env:
      MEXC_DEMO_WEB_TOKEN: ${{ secrets.MEXC_DEMO_WEB_TOKEN }}
      MEXC_DEMO_WRITE: YES
    steps:
      - uses: actions/checkout@v4
        with:
          ref: persistent-end2end-latency-v1
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: pip install -e . pytest
      - name: Regression suite
        run: pytest -q
      - name: Verify Demo secret exists
        shell: bash
        run: |
          if [ -z "$MEXC_DEMO_WEB_TOKEN" ]; then
            echo "MEXC_DEMO_WEB_TOKEN secret is missing"
            exit 2
          fi
      - name: Structured Testnet E2E
        shell: bash
        run: |
          printf 'A\n\n' | python -m mexc_tick_scalper.testnet_app \
            --discovery-top 5 \
            --scan-seconds "${{ inputs.scan_seconds }}" \
            --target-closed-trades 1 \
            --session-seconds "${{ inputs.session_seconds }}" \
            --max-signals 30 \
            --testnet-output testnet_smoke.csv
      - name: Upload Testnet telemetry
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: testnet-smoke-${{ github.run_id }}
          path: testnet_smoke.csv
          if-no-files-found: warn
